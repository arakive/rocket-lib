<div class="flex-1 flex flex-col gap-4 p-20">
  <router-outlet></router-outlet>
  <rocket-card>
    <div card-title>Titulo del card</div>
    <p>Contenido del card</p>
  </rocket-card>
  <button rocket-button class="w-fit">Mi botón</button>

  <rocket-data-table [columns]="columns" [dataSource]="dataSource"></rocket-data-table>

  <div class="grid grid-cols-2 gap-5">
    <rocket-map class="h-96 col-span-2 lg:col-span-1" [center]="[-3.7038, 40.4168]" [zoom]="5">
      <rocket-marker [coordinates]="[-3.7038, 40.4168]">
        <ng-template #popup>
          <div class="flex flex-col">
            <p class="font-semibold txt-xl">This is title</p>
            <p class="text-sm">This is a description</p>
          </div>
        </ng-template>
      </rocket-marker>
      <rocket-marker [coordinates]="[-3.45, 40.5]" color="#2563eb" [radius]="10">
        <ng-template #popup>
          <div class="flex flex-col">
            <p class="font-semibold txt-xl">This is title</p>
            <p class="text-sm">This is a description</p>
            <p>This value change each second: {{ second() }}</p>
          </div>
        </ng-template>
      </rocket-marker>
    </rocket-map>
    <rocket-map class="h-96 col-span-2 lg:col-span-1" [center]="[-3.7038, 40.4168]">
      <rocket-marker-group [geojson]="markerGroupGeoJSON">
        <ng-template #popup let-item>
          <div class="flex flex-col">
            <p class="font-semibold txt-xl">{{ item.name }}</p>
            <p class="italic">{{ item.category }}</p>
            <p class="text-xs">{{ item.description }}</p>
          </div>
        </ng-template>
      </rocket-marker-group>
    </rocket-map>
    <rocket-map class="h-96 col-span-2 lg:col-span-1" [center]="[-3.7038, 40.4168]">
      <rocket-marker-group [geojson]="markerGroupGeoJSON" multiplePopup>
        <ng-template #popup let-item>
          <div class="flex flex-col">
            <p class="font-semibold txt-xl">{{ item.name }}</p>
            <p class="italic">{{ item.category }}</p>
            <p class="text-xs">{{ item.description }}</p>
          </div>
        </ng-template>
      </rocket-marker-group>
    </rocket-map>
  </div>
</div>
